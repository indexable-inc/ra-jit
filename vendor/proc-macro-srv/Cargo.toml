# The proc-macro server of the toolchain in `harness/toolchain`, built by ra-jit, which loads the
# libraries ra-jit links (docs/no-rustc.md, step J1). `crates/` is `src/tools/rust-analyzer/crates`
# and `compiler/rustc_lexer` is `compiler/rustc_lexer` of rust-lang/rust at 1.99.0 (b940084d7),
# the crates the release's `rust-analyzer-proc-macro-srv` is built from, without their tests;
# `Cargo.lock` is the release's. The release builds the server in rustc's tree, against rustc's
# own crates; what is changed is what takes their place:
#
# - `proc-macro-srv/src/dylib.rs` loads a library with `dlopen` and reads the list of its macros
#   that ra-jit writes into it (`crates/ra-jit/src/macro_list.rs`), where the release reads
#   rustc's metadata with `rustc_metadata`; `dylib/proc_macros.rs` matches that list.
# - `rustc_proc_macro` is the standard library's `proc_macro` (rustc's tree builds the one as the
#   other), and `rustc_lexer` the vendored crate, not the compiler's.
# - `RUSTC_VERSION_STRING` is the release's `rustc --version`, written down where a build script
#   ran rustc for it; the CLI's build script, which asks git for a commit, is gone too.
# - `in-rust-tree` is on by default and asks for no `rustc_private` crate.
# - This manifest is the release's root one with only these crates.
[workspace]
members = ["crates/*", "compiler/rustc_lexer"]
resolver = "2"

[workspace.package]
rust-version = "1.95"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["rust-analyzer team"]
repository = "https://github.com/rust-lang/rust-analyzer"

[profile.dev]
debug = 1

[profile.release]
debug = 0

[workspace.dependencies]
# local crates
intern = { path = "./crates/intern", version = "0.0.0" }
parser = { path = "./crates/parser", version = "0.0.0" }
paths = { path = "./crates/paths", version = "0.0.0" }
proc-macro-api = { path = "./crates/proc-macro-api", version = "0.0.0" }
proc-macro-srv = { path = "./crates/proc-macro-srv", version = "0.0.0" }
span = { path = "./crates/span", version = "0.0.0" }
stdx = { path = "./crates/stdx", version = "0.0.0" }
syntax = { path = "./crates/syntax", version = "0.0.0" }
tt = { path = "./crates/tt", version = "0.0.0" }
vfs = { path = "./crates/vfs", version = "0.0.0" }
edition = { path = "./crates/edition", version = "0.0.0" }
rustc_lexer = { path = "./compiler/rustc_lexer" }

ra-ap-rustc_lexer = { version = "0.166", default-features = false }

la-arena = { version = "0.3.1" }

# non-local crates
arrayvec = "0.7.6"
camino = "1.2.2"
crossbeam-channel = "0.5.15"
either = "1.15.0"
indexmap = { version = "2.9.0", features = ["serde"] }
itertools = "0.15.0"
libc = "0.2.172"
nohash-hasher = "0.2.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rayon = "1.10.0"
rowan = "0.17.0"
salsa = { version = "0.28.2", default-features = false, features = [
    "rayon",
    "salsa_unstable",
    "macros",
    "inventory",
    "triomphe"
] }
semver = "1.0.26"
serde = { version = "1.0.219" }
serde_derive = { version = "1.0.219" }
serde_json = "1.0.140"
rustc-hash = "2.1.1"
rustc-literal-escaper = "0.0.7"
smallvec = { version = "1.15.1", features = [
    "const_new",
    "union",
    "const_generics",
] }
smol_str = "0.3.2"
temp-dir = "0.2.0"
text-size = "1.1.1"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
hashbrown = { version = "0.17.0", features = [
    "inline-more",
], default-features = false }

# We need to freeze the version of the crate, as the raw-api feature is considered unstable
dashmap = { version = "=6.2.1", features = ["raw-api", "inline"] }

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bootstrap)',
    "cfg(no_salsa_async_drops)",
] }
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
