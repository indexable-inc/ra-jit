# ra-jit: the daemon's own checks. The harnesses compare what ra-jit builds with what rustc
# builds, under both producers, each platform on a machine of its own kind
# (ra-jit-platform.yaml). What runs when, and how long it takes, is in docs/harness.md ("CI").
#
#   pull request: fmt alone (under a minute), so that it can join the merge queue at once
#   fast tier: merge queue, push to main, by hand (about 10 minutes)
#       fmt; on Linux x86-64, Linux AArch64 and macOS arm64 the unit tests, one build and the
#       quick harnesses (harness/ci.py --parts fast); rustc's borrow-check tests with a floor
#       under the passes; the pinned run-pass tests (Linux x86-64, macOS); vendor/rust-analyzer
#       on its own
#   full tier: nightly, by hand (an hour)
#       all of that with every harness, Windows x86-64 too, `cargo ra-jit` on small projects
#       (Linux x86-64, macOS) and the larger ones (AArch64), and the ripgrep bench. A failed
#       nightly opens an issue, or adds to the one still open.
#
# A change to nothing but documentation or the site runs fmt alone. `ci` is the one check that
# says whether everything that ran passed: it is the check branch rules and the merge queue
# require. The queue tests each pull request merged onto main and whatever is ahead of it, and
# main moves only to what it tested (docs/harness.md, "CI").
name: ra-jit
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "fast or full"
        default: full
        type: choice
        options: [full, fast]

concurrency:
  # A pull request's newer push cancels its run before. Every push to main and every entry of
  # the merge queue runs to the end in a group of its own: with a merge every few minutes, one
  # group for main replaced each waiting run with the next, and main had almost no finished run.
  group: ra-jit-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which tier runs: `none` for a pull request (the merge queue tests it merged, and testing it
  # alone first would only make its landing wait twice) and for a change to nothing but
  # documentation, the files of the merge queue's entry or of the push against the commit main
  # was at before it. Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          TIER: ${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'fast' }}
        run: |
          case "$EVENT" in
            pull_request) echo "tier=none" | tee -a "$GITHUB_OUTPUT"; exit 0;;
            push) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq 'if (.files | length) >= 300 then "" else .files[].filename end') || files=;;
            merge_group) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq 'if (.files | length) >= 300 then "" else .files[].filename end') || files=;;
            *) files=;;
          esac
          code=false
          [ -n "$files" ] || code=true
          while read -r file; do
            case "$file" in
              .github/workflows/ra-jit*.yaml|.github/actions/*) code=true;;
              *.md|docs/*|site/*|LICENSE*|.github/*) ;;
              *) code=true;;
            esac
          done <<< "$files"
          [ "$code" = true ] || TIER=none
          echo "tier=$TIER" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: fmt, harness imports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
      # Some scripts ask rustc for the host when imported: after the toolchain is installed.
      - run: python3 harness/imports.py
      # No new place in ra-jit's code starts rustc, rustdoc or cargo (docs/no-rustc.md).
      - run: python3 harness/rustcsites.py
      # vendor/ too: the forks' rustfmt.toml files are read for their code, and a fork's own
      # edits are held to them like ra-jit's.
      - run: cargo fmt --all -- --check

  linux-x64:
    name: linux x64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/ra-jit-platform.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      tier: ${{ needs.changes.outputs.tier }}
      borrowck: true
      pinned-ui: true
      cargo-ra-jit: ${{ needs.changes.outputs.tier == 'full' }}
      bench: ${{ needs.changes.outputs.tier == 'full' }}
      bun-e2e: true

  linux-arm64:
    name: linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/ra-jit-platform.yaml
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: ${{ needs.changes.outputs.tier }}
      projects: ${{ needs.changes.outputs.tier == 'full' }}

  macos:
    name: macos arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/ra-jit-platform.yaml
    with:
      platform: macos-arm64
      os: macos-15
      tier: ${{ needs.changes.outputs.tier }}
      pinned-ui: true
      cargo-ra-jit: ${{ needs.changes.outputs.tier == 'full' }}

  # Its build alone takes longer than the whole fast tier.
  windows:
    name: windows x64
    needs: changes
    if: needs.changes.outputs.tier == 'full'
    uses: ./.github/workflows/ra-jit-platform.yaml
    with:
      platform: windows-x64
      os: windows-2025
      tier: full

  # vendor/rust-analyzer as the fork has it, built and tested outside this repository, so that
  # the subtree cannot come to depend on crates/ (docs/architecture-split.md, step 5). The
  # tests of ide-diagnostics are the verdict's (the daemon's errors are its diagnostics), and
  # add about 15 s to the job.
  fork:
    name: fork alone
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: cp -r vendor/rust-analyzer vendor/rustc_type_ir vendor/rustc_next_trait_solver "$RUNNER_TEMP/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/rust-analyzer
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: ${{ runner.temp }}/rust-analyzer
        run: cargo test -p hir-ty -p hir-ty-borrowck -p hir-ty-wfcheck -p ide-diagnostics && cargo check -p hir

  ci:
    name: ci
    needs: [changes, fmt, linux-x64, linux-arm64, macos, windows, fork]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null

  nightly:
    name: nightly issue
    needs: ci
    if: always() && github.event_name == 'schedule' && needs.ci.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue
