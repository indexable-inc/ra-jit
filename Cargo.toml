[workspace]
members = ["crates/ra-jit", "crates/hir-ty-codegen", "crates/ra-jit-store", "crates/ra-jit-expand", "crates/ra-jit-fuzz", "crates/ra-jit-live", "crates/ra-jit-bench", "crates/ra-jit-cache", "crates/ra-jit-cache-macros", "vendor/rust-analyzer/lib/rowan"]
# `ra-jit-wasm` turns on a feature of `hir-ty-codegen` that swaps the code generator's output, which
# must not be unified into a build of the native crates.
exclude = ["crates/ra-jit-wasm", "demo", "harness", "vendor/proc-macro-srv"]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ra-jit contributors"]
repository = "https://github.com/indexable-inc/ra-jit"
homepage = "https://ra-jit.ix.dev"
keywords = ["compiler", "jit", "hot-reload", "rust-analyzer", "cargo"]
categories = ["development-tools", "development-tools::build-utils"]

[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
rowan.opt-level = 3
rustc-hash.opt-level = 3
smol_str.opt-level = 3
text-size.opt-level = 3
serde.opt-level = 3
salsa.opt-level = 3
dissimilar.opt-level = 3

# This speeds up `cargo xtask dist`.
miniz_oxide.opt-level = 3

[profile.release]
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0

[profile.dev-rel]
inherits = "release"
debug = 2

# The binaries a release ships, built with PGO by .github/scripts/build_release.py
# (docs/reports/RELEASE-BUILD.md). Thin LTO takes 4-5% off an edit's work in the daemon but
# makes a rebuild of ra-jit after a one-line change 2.5 times longer, so `release`, which the
# harnesses and CI build after every change, goes without.
[profile.dist]
inherits = "release"
lto = "thin"

[patch.'crates-io']
# rustc's layout code, from the tag of the stable in `harness/toolchain`.
ra-ap-rustc_abi = { path = "vendor/rustc_abi" }
rowan = { path = "vendor/rust-analyzer/lib/rowan" }
# The trait solver, with fixes of rustc's backported.
ra-ap-rustc_type_ir = { path = "vendor/rustc_type_ir" }
ra-ap-rustc_next_trait_solver = { path = "vendor/rustc_next_trait_solver" }

# line-index = { path = "lib/line-index" }
# la-arena = { path = "lib/la-arena" }
# lsp-server = { path = "lib/lsp-server" }


# ungrammar = { path = "lib/ungrammar" }

# salsa = { path = "../salsa" }

[workspace.dependencies]
# local crates
macros = { path = "vendor/rust-analyzer/crates/macros", version = "0.0.0" }
base-db = { path = "vendor/rust-analyzer/crates/base-db", version = "0.0.0" }
cfg = { path = "vendor/rust-analyzer/crates/cfg", version = "0.0.0", features = ["tt", "syntax"] }
hir = { path = "vendor/rust-analyzer/crates/hir", version = "0.0.0" }
hir-def = { path = "vendor/rust-analyzer/crates/hir-def", version = "0.0.0" }
hir-expand = { path = "vendor/rust-analyzer/crates/hir-expand", version = "0.0.0" }
hir-ty = { path = "vendor/rust-analyzer/crates/hir-ty", version = "0.0.0" }
hir-ty-borrowck = { path = "vendor/rust-analyzer/crates/hir-ty-borrowck", version = "0.0.0" }
hir-ty-wfcheck = { path = "vendor/rust-analyzer/crates/hir-ty-wfcheck", version = "0.0.0" }
hir-ty-codegen = { path = "crates/hir-ty-codegen" }
ra-jit-expand = { path = "crates/ra-jit-expand" }
ra-jit-store = { path = "crates/ra-jit-store" }
ra-jit-fuzz = { path = "crates/ra-jit-fuzz" }
hir-ide = { path = "vendor/rust-analyzer/crates/hir-ide", version = "0.0.0" }
ide = { path = "vendor/rust-analyzer/crates/ide", version = "0.0.0" }
ide-assists = { path = "vendor/rust-analyzer/crates/ide-assists", version = "0.0.0" }
ide-completion = { path = "vendor/rust-analyzer/crates/ide-completion", version = "0.0.0" }
ide-db = { path = "vendor/rust-analyzer/crates/ide-db", version = "0.0.0" }
ide-diagnostics = { path = "vendor/rust-analyzer/crates/ide-diagnostics", version = "0.0.0" }
ide-ssr = { path = "vendor/rust-analyzer/crates/ide-ssr", version = "0.0.0" }
intern = { path = "vendor/rust-analyzer/crates/intern", version = "0.0.0" }
load-cargo = { path = "vendor/rust-analyzer/crates/load-cargo", version = "0.0.0" }
mbe = { path = "vendor/rust-analyzer/crates/mbe", version = "0.0.0" }
parser = { path = "vendor/rust-analyzer/crates/parser", version = "0.0.0" }
paths = { path = "vendor/rust-analyzer/crates/paths", version = "0.0.0" }
proc-macro-api = { path = "vendor/rust-analyzer/crates/proc-macro-api", version = "0.0.0" }
proc-macro-srv = { path = "vendor/rust-analyzer/crates/proc-macro-srv", version = "0.0.0" }
profile = { path = "vendor/rust-analyzer/crates/profile", version = "0.0.0" }
project-model = { path = "vendor/rust-analyzer/crates/project-model", version = "0.0.0" }
span = { path = "vendor/rust-analyzer/crates/span", version = "0.0.0" }
stdx = { path = "vendor/rust-analyzer/crates/stdx", version = "0.0.0" }
syntax = { path = "vendor/rust-analyzer/crates/syntax", version = "0.0.0" }
syntax-bridge = { path = "vendor/rust-analyzer/crates/syntax-bridge", version = "0.0.0" }
test-fixture = { path = "vendor/rust-analyzer/crates/test-fixture", version = "0.0.0" }
test-utils = { path = "vendor/rust-analyzer/crates/test-utils", version = "0.0.0" }
toolchain = { path = "vendor/rust-analyzer/crates/toolchain", version = "0.0.0" }
tt = { path = "vendor/rust-analyzer/crates/tt", version = "0.0.0" }
vfs-notify = { path = "vendor/rust-analyzer/crates/vfs-notify", version = "0.0.0" }
vfs = { path = "vendor/rust-analyzer/crates/vfs", version = "0.0.0" }
edition = { path = "vendor/rust-analyzer/crates/edition", version = "0.0.0" }

ra-ap-rustc_lexer = { version = "0.166", default-features = false }
ra-ap-rustc_parse_format = { version = "0.166", default-features = false }
ra-ap-rustc_index = { version = "0.166", default-features = false }
ra-ap-rustc_abi = { version = "0.166", default-features = false }
ra-ap-rustc_pattern_analysis = { version = "0.166", default-features = false }
ra-ap-rustc_ast_ir = { version = "0.166", default-features = false }
ra-ap-rustc_type_ir = { version = "0.166", default-features = false }
ra-ap-rustc_next_trait_solver = { version = "0.166", default-features = false }

# local crates that aren't published to crates.io. These should not have versions.

# in-tree crates that are published separately and follow semver. See lib/README.md
line-index = { version = "0.1.2" }
la-arena = { version = "0.3.1" }
lsp-server = { version = "0.7.9" }

# non-local crates
anyhow = "1.0.98"
arrayvec = "0.7.6"
bitflags = "2.9.1"
cargo_metadata = "0.23.1"
camino = "1.2.2"
crossbeam-channel = "0.5.15"
dissimilar = "1.0.10"
dot = "0.1.4"
either = "1.15.0"
expect-test = "1.5.1"
indexmap = { version = "2.9.0", features = ["serde"] }
itertools = "0.15.0"
libc = "0.2.172"
nohash-hasher = "0.2.0"
oorandom = "11.1.5"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
process-wrap = { version = "9.1.0", features = ["std"] }
pulldown-cmark-to-cmark = "10.0.4"
pulldown-cmark = { version = "0.9.6", default-features = false }
rayon = "1.10.0"
rowan = "0.17.0"
# Ideally we'd not enable the macros feature but unfortunately the `tracked` attribute does not work
# on impls without it
salsa = { version = "0.28.5", default-features = false, features = [
    "rayon",
    "salsa_unstable",
    "macros",
    "inventory",
    "triomphe"
] }
semver = "1.0.26"
serde = { version = "1.0.219" }
serde_derive = { version = "1.0.219" }
serde_json = "1.0.140"
rustc-hash = "2.1.1"
rustc-literal-escaper = "0.0.7"
smallvec = { version = "1.15.1", features = [
    "const_new",
    "union",
    "const_generics",
] }
smol_str = "0.3.2"
text-size = "1.1.1"
toml = "1.1.2"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-tree = "0.4.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "registry",
    "fmt",
    "local-time",
    "std",
    "time",
    "tracing-log",
] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
unicode-width = "0.2.2"
url = "2.5.4"
xshell = "0.2.7"
thin-vec = "0.2.16"
petgraph = { version = "0.8.2", default-features = false }
hashbrown = { version = "0.17.0", features = [
    "inline-more",
], default-features = false }

# We need to freeze the version of the crate, as the raw-api feature is considered unstable
dashmap = { version = "=6.2.1", features = ["raw-api", "inline"] }

# We need to freeze this as `1.0.26` breaks the compilation of `rustc_lexer` during our in-tree
# libraries publish
unicode-ident = "=1.0.24"

[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.rust]
# remember to update RUSTFLAGS in ci.yml if you add something here

elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bootstrap)',
    "cfg(no_salsa_async_drops)",
] }
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
## lint groups
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

## allow following lints
too_long_first_doc_paragraph = "allow"
# subjective
single_match = "allow"
# () makes a fine error in most cases
result_unit_err = "allow"
# We don't expose public APIs that matter like this
len_without_is_empty = "allow"
# We have macros that rely on this currently
enum_variant_names = "allow"
# Builder pattern disagrees
new_ret_no_self = "allow"
# Has a bunch of false positives
useless_asref = "allow"
# Has false positives
assigning_clones = "allow"
# Does not work with macros
vec_init_then_push = "allow"
# Our tests have a lot of these
literal_string_with_formatting_args = "allow"
# This lint has been empowered but now also triggers on cases where its invalid to do so
# due to it ignoring move analysis
unnecessary_map_or = "allow"

## Following lints should be tackled at some point
too_many_arguments = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

## warn at following lints
# CI raises these to deny
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

rc_buffer = "warn"
str_to_string = "warn"
